name: E2E (optional)

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Playwright stack
        env:
          TUNNEL_SMOKE_URL: ${{ secrets.TUNNEL_SMOKE_URL }}
        run: |
          docker compose -f compose.e2e.yml down -v --remove-orphans || true
          docker compose -f compose.e2e.yml up --build --abort-on-container-exit --exit-code-from playwright
      - name: Export logs on failure
        if: failure()
        run: docker compose -f compose.e2e.yml logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
