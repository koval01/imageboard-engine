name: Production Build & Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgres://postgres:password@localhost:5432/ebala_test"
  JWT_SECRET: "ci-testing-secret-key-change-this"
  JWT_EXPIRED_IN: "60m"
  JWT_MAXAGE: "60"
  S3_PUBLIC_URL: "http://localhost:9000/test-bucket"
  STORAGE_TYPE: "local"
  MEDIA_ROOT: "./media"
  MEDIA_PORT: "8083"
  S3_ACCESS_KEY: "dummy"
  S3_SECRET_KEY: "dummy"
  S3_BUCKET_NAME: "dummy"
  S3_ENDPOINT: "http://localhost:9000"

jobs:
  build-verify-release:
    name: Build, Test & Release
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ebala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libpq-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: js-tools/package.json

      - name: Build Frontend
        working-directory: ./js-tools
        run: |
          npm ci
          npm run build-all

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Binary (Release)
        run: cargo build --release --locked --verbose

      - name: Create Media Directory
        run: mkdir -p ./media

      - name: Runtime Health Check
        timeout-minutes: 2
        run: |
          ./target/release/ebala &
          SERVER_PID=$!
          echo "Waiting for server to start on port 8082..."
          
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8082 > /dev/null; then
              echo "✅ Server is responding!"
              HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" http://127.0.0.1:8082/about)
              if [ "$HTTP_CODE" -eq "200" ]; then
                echo "✅ /about returned 200 OK"
                kill $SERVER_PID
                exit 0
              fi
            fi
            sleep 1
          done
          
          echo "❌ Server failed to start."
          kill $SERVER_PID || true
          exit 1

      - name: Prepare Release Assets
        run: |
          # Create a directory to organize assets
          mkdir -p release-assets
          
          # 1. Copy the raw binary (easy download)
          cp target/release/ebala release-assets/ebala
          
          # 2. Create a compressed tarball (preserves permissions)
          tar -czvf release-assets/ebala-linux-x86_64.tar.gz -C target/release ebala
          
          # 3. Calculate SHA256 checksum
          sha256sum release-assets/ebala-linux-x86_64.tar.gz > release-assets/checksum.sha256

      - name: Upload to "Continuous" Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: continuous
          name: "Continuous Build (Latest)"
          body: |
            **Automated Build**
            - Commit: `${{ github.sha }}`
            - Date: $(date -u)
            - Built on: Ubuntu 24.04 (Compatible with 25.04)
            
            ### How to update on server:
            ```bash
            wget -O ebala.tar.gz https://github.com/${{ github.repository }}/releases/download/continuous/ebala-linux-x86_64.tar.gz
            tar -xzvf ebala.tar.gz
            chmod +x ebala
            systemctl restart ebala
            ```
          prerelease: true
          files: |
            release-assets/ebala
            release-assets/ebala-linux-x86_64.tar.gz
            release-assets/checksum.sha256
