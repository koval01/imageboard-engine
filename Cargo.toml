[package]
name = "kryivka_org"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
debug = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "catch-panic", "set-header"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
image = "0.25"
webp = "0.3"
bytes = "1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
hex = "0.4"
kamadak-exif = "0.6"
image_hasher = "3"
base64 = "0.22"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
ipnet = "2"
chrono-tz = "0.10"
zxcvbn = "3"
crypto_box = "0.9"
blake2 = "0.10"
ammonia = "4"
html-escape = "0.2"

[dev-dependencies]
urlencoding = "2"

[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = "0.6"
