name: kryivka-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kryivka
      POSTGRES_PASSWORD: kryivka
      POSTGRES_DB: kryivka_e2e
    volumes:
      - e2e_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryivka -d kryivka_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kryivka
      MINIO_ROOT_PASSWORD: kryivka-e2e-silo
    volumes:
      - e2e_silo:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: postgres://kryivka:kryivka@postgres:5432/kryivka_e2e
      REDIS_URL: redis://redis:6379
      JWT_SECRET: e2e-jwt-secret-not-for-production
      JWT_EXPIRED_IN: 60m
      JWT_MAXAGE: 60
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://silo:9000
      S3_BUCKET_NAME: kryivka
      S3_ACCESS_KEY: kryivka
      S3_SECRET_KEY: kryivka-e2e-silo
      S3_PUBLIC_URL: http://frontend/media
      SERVE_FRONTEND: "false"
      ADMIN_BOOTSTRAP_USER: admin
      ADMIN_BOOTSTRAP_KEY: "E2e-Staff-Key#42!"
      JANITOR_BOOTSTRAP_USER: janitor
      JANITOR_BOOTSTRAP_KEY: "E2e-Mod-Key#42x!"
      THREAD_AGE_LIMIT_DAYS: 30
      PURGE_INTERVAL_SECS: 600
      RATE_LIMIT_SECS: "3"
      RUST_LOG: info
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      silo:
        condition: service_healthy

  playwright:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend
      E2E_ADMIN_KEY: "E2e-Staff-Key#42!"
      E2E_JANITOR_KEY: "E2e-Mod-Key#42x!"
      E2E_POST_GAP_MS: "3500"
      TUNNEL_SMOKE_URL: ${TUNNEL_SMOKE_URL:-}
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report

volumes:
  e2e_pg:
  e2e_silo:
