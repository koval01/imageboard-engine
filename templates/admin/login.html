{% extends "layout/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-20 p-6 bg-skin-surface border border-skin-border rounded shadow">
  <h1 class="text-2xl font-bold mb-4 text-skin-text">Admin Access</h1>

  {% if let Some(e) = error %}
  <div class="text-red-500 mb-4 text-sm font-bold border border-red-500/20 bg-red-500/10 p-2 rounded">{{ e }}</div>
  {% endif %}

  <!-- HTMX Form to trigger JS Proof-of-Work -->
  <form hx-post="/admin/login" hx-target="body" hx-push-url="true">
    <div class="mb-4">
      <label class="block text-xs font-bold text-skin-muted uppercase mb-1">Service Key</label>
      <input type="password" name="key" placeholder="Enter key..." class="w-full p-2 border border-skin-border rounded bg-skin-input text-skin-text focus:ring-2 focus:ring-skin-accent outline-none" required autofocus>
    </div>
    <button type="submit" class="w-full bg-skin-primary text-white p-2 rounded font-bold hover:bg-skin-primary-hover transition-colors">
      Login
    </button>
  </form>
</div>
{% endblock %}
