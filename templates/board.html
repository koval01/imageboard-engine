{% extends "layout/base.html" %}

{% block content %}

<!-- Board Header -->
<div class="text-center mb-8 pt-4">
    <h2 class="text-3xl text-skin-accent font-bold tracking-tight">/{{ board.slug }}/ <span class="text-skin-text font-normal text-lg ml-2">{{ board.name }}</span></h2>
    <p class="text-xs text-skin-muted mt-1">{{ board.description }}</p>
</div>

<!-- Collapsible Post Form (Protected by Anti-Bot Token) -->
<div class="flex justify-center mb-10">
    <div class="w-full max-w-xl">
        <details class="group bg-skin-surface border border-skin-border rounded shadow-sm open:shadow-lg transition-all duration-300">
            <summary class="list-none flex items-center justify-center p-3 cursor-pointer font-bold text-skin-text hover:text-skin-accent select-none transition-colors">
                <span class="mr-2 text-skin-muted">[</span>
                <span>Створити новий тред</span>
                <span class="ml-2 text-skin-muted">]</span>
            </summary>

            <div class="p-4 border-t border-skin-border bg-skin-base/50">
                <!-- Converted to HTMX to trigger token generation middleware -->
                <form hx-post="/{{ board.slug }}/submit"
                      hx-encoding="multipart/form-data"
                      hx-target="body"
                      hx-indicator="#form-spinner"
                      class="flex flex-col gap-3">

                    <div class="flex flex-col gap-1">
                        <input type="text" name="subject" placeholder="Тема (опціонально)" class="w-full p-2 text-sm rounded border border-skin-border bg-skin-input focus:ring-1 focus:ring-skin-accent transition-shadow placeholder-skin-muted/50">
                    </div>
                    <div>
                        <textarea name="content" rows="5" placeholder="Ваше повідомлення..." class="w-full p-2 text-sm rounded border border-skin-border bg-skin-input focus:ring-1 focus:ring-skin-accent transition-shadow resize-y placeholder-skin-muted/50" required></textarea>
                    </div>

                    <div class="flex justify-between items-center gap-2 mt-1">
                        <div class="flex-grow">
                            <label class="flex items-center gap-2 w-full cursor-pointer bg-skin-input border border-skin-border rounded p-1.5 hover:border-skin-accent transition-colors group">
                                <div class="bg-skin-header text-white text-[10px] font-bold px-2 py-1 rounded group-hover:bg-skin-accent transition-colors">
                                    ФАЙЛИ
                                </div>
                                <span id="new-thread-file-label" class="text-[10px] text-skin-muted truncate select-none">Макс. 5 (до 2МБ)</span>
                                <input type="file" name="file" multiple accept="image/*" class="hidden" onchange="document.getElementById('new-thread-file-label').innerText = this.files.length > 0 ? this.files.length + ' файл(ів)' : 'Макс. 5 (до 2МБ)'">
                            </label>
                        </div>

                        <button type="submit" class="flex items-center gap-2 self-end bg-skin-primary text-white px-6 py-2 rounded text-sm font-bold hover:bg-skin-primary-hover shadow-sm transition-colors uppercase disabled:opacity-50">
                            <span>Надіслати</span>
                            <span id="form-spinner" class="htmx-indicator loading loading-spinner loading-xs"></span>
                        </button>
                    </div>
                </form>
            </div>
        </details>
    </div>
</div>

<hr class="border-skin-border mb-8 opacity-50">

<!-- Encrypted Data Blob -->
<script type="text/json" id="__KR_DATA">{{ payload }}</script>

<!-- Thread List Container (Client-Side Rendering) -->
<div id="board-container" class="flex flex-col gap-10 min-h-[50vh] opacity-0 transition-opacity duration-700">
    <!-- Loading State for Bots/No-JS -->
    <div class="flex flex-col items-center justify-center py-20">
        <span class="loading loading-bars loading-lg text-skin-accent"></span>
        <p class="text-xs font-mono text-skin-muted mt-4">Завантажуємо...</p>
    </div>
</div>

<!-- Initialization -->
<script src="/assets/js/core.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        window.__kr_hydrate({
            mode: 'board',
            targetId: 'board-container',
            cdn: '{{ cdn_url }}',
            boardSlug: '{{ board.slug }}'
        });
    });
</script>

<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6 md:hidden z-50">
    <a href="#" onclick="document.querySelector('details').open = true; window.scrollTo({top: 0, behavior: 'smooth'}); return false;"
       class="flex items-center justify-center w-14 h-14 bg-skin-primary text-white rounded-full shadow-lg hover:bg-skin-primary-hover transition-transform active:scale-95">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </a>
</div>

{% endblock %}
