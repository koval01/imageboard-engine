{% extends "layout/base.html" %}

{% block content %}
<div class="flex flex-col items-center">
    <h1 class="text-3xl font-bold mb-8 text-gray-800">Boards</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-4xl">
        {% for board in boards %}
        <a href="/{{ board.slug }}" class="block p-6 bg-white border border-gray-300 rounded shadow hover:bg-orange-50 transition">
            <h2 class="text-xl font-bold text-orange-600">/{{ board.slug }}/ - {{ board.name }}</h2>
            <p class="text-gray-600 mt-2">{{ board.description }}</p>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
