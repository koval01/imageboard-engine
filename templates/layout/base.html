<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryivka.org</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
    <script src="/assets/js/htmx.min.js"></script>
    <script src="/assets/js/sweetalert2.min.js"></script>

    <!-- Theme Logic -->
    <script>
        (function() {
            function getTheme() {
                if (localStorage.getItem('theme')) {
                    return localStorage.getItem('theme');
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', getTheme());
        })();
    </script>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans bg-skin-base text-skin-text">

<!-- Navbar -->
<nav class="bg-skin-header text-gray-300 text-xs shadow-sm sticky top-0 z-50 border-b border-skin-border/10">
    <div class="container mx-auto px-2 h-10 flex items-center justify-between">
        <!-- Left: Boards -->
        <div class="flex items-center overflow-x-auto whitespace-nowrap scrollbar-hide mask-fade mr-2">
            <a href="/" class="font-bold text-white mr-3 hover:text-skin-accent transition tracking-wide">KRYIVKA</a>
            <span class="text-gray-600 mr-1">[</span>
            <div class="flex gap-2 font-mono text-gray-400">
                <a href="/b" class="hover:text-white hover:underline">b</a> /
                <a href="/pol" class="hover:text-white hover:underline">pol</a> /
                <a href="/tech" class="hover:text-white hover:underline">tech</a> /
                <a href="/a" class="hover:text-white hover:underline">a</a> /
                <a href="/sex" class="hover:text-white hover:underline">sex</a>
            </div>
            <span class="text-gray-600 ml-1">]</span>
        </div>

        <!-- Right: Theme Toggle -->
        <div class="flex items-center gap-3 shrink-0">
            <button id="theme-toggle" class="hover:text-skin-accent focus:outline-none transition-colors" title="Перемикач теми">
                <!-- Sun Icon -->
                <svg id="icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Moon Icon -->
                <svg id="icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </div>
</nav>

<!-- Content -->
<main class="container mx-auto px-2 md:px-4 flex-grow max-w-7xl mt-6">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="mt-12 py-8 text-center text-xs text-skin-muted border-t border-skin-border/50 bg-skin-surface/30">
    <div class="flex justify-center gap-6 font-medium mb-4">
        <a href="/about" class="hover:text-skin-accent transition-colors">Про нас</a>
        <a href="/rules" class="hover:text-skin-accent transition-colors">Правила</a>
        <a href="#" class="hover:text-skin-accent transition-colors">API</a>
    </div>
    <div class="opacity-50">
        &copy; 2026 Kryivka.org. Всі права належать коту Борису.
    </div>
</footer>

<!-- Scripts -->
<script>
    // Theme Switcher Logic
    const themeToggle = document.getElementById('theme-toggle');
    const iconLight = document.getElementById('icon-light');
    const iconDark = document.getElementById('icon-dark');
    const html = document.documentElement;

    function updateIcons(theme) {
        if (theme === 'dark') {
            iconLight.classList.remove('hidden');
            iconDark.classList.add('hidden');
        } else {
            iconLight.classList.add('hidden');
            iconDark.classList.remove('hidden');
        }
    }

    updateIcons(html.getAttribute('data-theme'));

    themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcons(newTheme);
    });

    // Disclaimer Logic
    document.addEventListener('DOMContentLoaded', () => {
        const hasAccepted = localStorage.getItem('kryivka_disclaimer_accepted');

        if (!hasAccepted) {
            Swal.fire({
                title: 'Ласкаво просимо',
                html: `
                    <div class="text-left text-sm space-y-3">
                        <p>Ви заходите на <strong>Kryivka.org</strong> — анонімний простір для вільного спілкування.</p>
                        <p>Зверніть увагу:</p>
                        <ul class="list-disc pl-5 opacity-80">
                            <li>Контент створюється користувачами.</li>
                            <li>Адміністрація не несе відповідальності за думки авторів.</li>
                            <li>Може містити матеріали, не призначені для дітей (18+).</li>
                        </ul>
                        <p class="font-medium text-center mt-4">Ви погоджуєтесь з правилами?</p>
                    </div>
                `,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Вхід',
                cancelButtonText: 'Вихід',
                confirmButtonColor: 'var(--color-primary)',
                cancelButtonColor: '#71717a',
                background: 'var(--color-bg-surface)',
                color: 'var(--color-text-base)',
                backdrop: `rgba(0,0,0,0.8)`,
                allowOutsideClick: false,
                allowEscapeKey: false
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.setItem('kryivka_disclaimer_accepted', 'true');
                } else {
                    window.location.href = "https://google.com";
                }
            });
        }
    });
</script>
</body>
</html>
