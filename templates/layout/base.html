<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryivka.org</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">

    <!-- Libraries -->
    <script src="/assets/js/htmx.min.js"></script>
    <script src="/assets/js/sweetalert2.min.js"></script>
    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.28/dist/vue.global.min.js"></script>
    <!-- Main Logic -->
    <script src="/assets/js/core.min.js" defer></script>

    <style>
        /* Toast Transitions */
        .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(30px); }
        /* Loader Overlay */
        .loader-overlay { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(2px); z-index: 9999; }
        [data-theme="dark"] .loader-overlay { background: rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-skin-surface text-skin-text font-sans text-[13px]">

<div id="app">
    <!-- Global Loader (Wrapped in raw for Vue) -->
    {% raw %}
    <div v-if="isLoading" class="loader-overlay fixed inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300">
        <div class="bg-skin-header p-4 rounded-lg shadow-lg border border-skin-border flex flex-col items-center gap-2">
            <svg class="animate-spin h-8 w-8 text-skin-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="font-bold text-xs uppercase tracking-wider">Processing...</span>
        </div>
    </div>

    <!-- Toast Notifications (Wrapped in raw for Vue) -->
    <div class="fixed top-4 right-4 z-[10000] flex flex-col gap-2 pointer-events-none">
        <transition-group name="toast">
            <div v-for="toast in toasts" :key="toast.id"
                 class="pointer-events-auto p-3 rounded shadow-lg border text-sm font-bold min-w-[250px] cursor-pointer"
                 :class="toast.type === 'error' ? 'bg-red-100 border-red-400 text-red-800' : 'bg-green-100 border-green-400 text-green-800'"
                 @click="removeToast(toast.id)">
                {{ toast.message }}
            </div>
        </transition-group>
    </div>
    {% endraw %}

    <!-- Header -->
    {% include "partials/header.html" %}

    <!-- Main Content -->
    <main class="px-2 pb-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "partials/footer.html" %}
</div>

<script>
    const { createApp, ref } = Vue;

    const app = createApp({
        setup() {
            const isLoading = ref(false);
            const toasts = ref([]);
            let toastId = 0;

            // Global exposure for non-Vue JS (HTMX/Core.js) to trigger toasts
            window.showToast = (message, type = 'success') => {
                const id = toastId++;
                toasts.value.push({ id, message, type });
                setTimeout(() => {
                    toasts.value = toasts.value.filter(t => t.id !== id);
                }, 4000);
            };

            // HTMX Integration
            document.body.addEventListener('htmx:beforeRequest', () => { isLoading.value = true; });
            document.body.addEventListener('htmx:afterRequest', () => { isLoading.value = false; });
            document.body.addEventListener('htmx:responseError', () => {
                isLoading.value = false;
                window.showToast("Server Error", "error");
            });
            document.body.addEventListener('htmx:sendError', () => {
                isLoading.value = false;
                window.showToast("Network Error", "error");
            });

            // Processing Time Update via HTMX headers
            document.body.addEventListener('htmx:afterOnLoad', function(evt) {
                const xhr = evt.detail.xhr;
                const timing = xhr.getResponseHeader('X-Processing-Time');
                if (timing) {
                    const el = document.getElementById('proc-time');
                    if(el) el.innerText = `Processed in ${timing}`;
                }
            });

            const removeToast = (id) => {
                toasts.value = toasts.value.filter(t => t.id !== id);
            };

            return { isLoading, toasts, removeToast };
        }
    });

    app.mount('#app');
</script>

</body>
</html>
