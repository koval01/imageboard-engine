<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryivka.org</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">

    <!-- Core Libraries -->
    <script src="/assets/js/htmx.min.js"></script>
    <script src="/assets/js/sweetalert2.min.js"></script>
    <!-- Main Logic -->
    <script src="/assets/js/core.min.js" defer></script>
</head>
<body class="bg-skin-surface text-skin-text font-sans text-[13px]">

<!-- Header -->
<div class="border-b border-skin-border-reply mb-2 p-1 text-[13px]">
    <div class="flex flex-wrap justify-between items-center">
        <div class="flex gap-1">
            <span class="text-skin-muted">[</span>
            <a href="/" class="hover:underline font-bold">Home</a>
            <span class="text-skin-muted">/</span>
            <a href="/b" class="hover:underline">b</a>
            <span class="text-skin-muted">/</span>
            <a href="/pol" class="hover:underline">pol</a>
            <span class="text-skin-muted">/</span>
            <a href="/tech" class="hover:underline">tech</a>
            <span class="text-skin-muted">/</span>
            <a href="/a" class="hover:underline">a</a>
            <span class="text-skin-muted">/</span>
            <a href="/sex" class="hover:underline">sex</a>
            <span class="text-skin-muted">]</span>
        </div>

        <div class="flex gap-2">
            {% block admin_nav %}{% endblock %}

            <span class="text-skin-muted">[</span>
            <button id="theme-toggle" class="hover:underline cursor-pointer">Theme</button>
            <span class="text-skin-muted">]</span>
        </div>
    </div>
</div>

<!-- Main Content -->
<main class="px-2 pb-10">
    {% block content %}{% endblock %}
</main>

<footer class="mt-8 pb-4 text-center text-xs text-skin-muted border-t border-skin-border-reply pt-2">
    <div class="mb-2">
        <a href="/about" class="hover:underline">About</a> •
        <a href="/rules" class="hover:underline">Rules</a>
    </div>
    <div>Copyright © 2026 Kryivka.org</div>
</footer>

<!-- Icons for Theme Toggle (Hidden, handled by JS if needed for other places) -->
<svg id="icon-light" class="hidden"></svg>
<svg id="icon-dark" class="hidden"></svg>

</body>
</html>
