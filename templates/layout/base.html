<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebala.ch</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css" />
    <script src="/assets/js/htmx.min.js"></script>

    <!-- Theme Logic (Must be in head) -->
    <script>
        (function() {
            function getTheme() {
                if (localStorage.getItem('theme')) {
                    return localStorage.getItem('theme');
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', getTheme());
        })();
    </script>
</head>
<body class="antialiased min-h-screen flex flex-col">

<!-- Navbar -->
<nav class="bg-skin-header text-gray-300 text-xs shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-2 h-8 flex items-center justify-between">
        <!-- Left: Boards (Scrollable on mobile) -->
        <div class="flex items-center overflow-x-auto whitespace-nowrap scrollbar-hide mask-fade mr-2">
            <a href="/" class="font-bold text-skin-accent mr-2 hover:text-white transition">Головна</a>
            <span class="text-gray-600 mr-1">[</span>
            <div class="flex gap-2">
                <a href="/b" class="hover:text-skin-accent hover:underline">b</a>
                <a href="/tech" class="hover:text-skin-accent hover:underline">tech</a>
                <a href="/a" class="hover:text-skin-accent hover:underline">a</a>
                <a href="/sex" class="hover:text-skin-accent hover:underline">sex</a>
                <!-- Add more dynamic boards here -->
            </div>
            <span class="text-gray-600 ml-1">]</span>
        </div>

        <!-- Right: Settings / Theme Toggle -->
        <div class="flex items-center gap-3 shrink-0">
            <button id="theme-toggle" class="hover:text-skin-accent focus:outline-none" title="Змінити тему">
                <!-- Sun Icon -->
                <svg id="icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Moon Icon -->
                <svg id="icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </div>
</nav>

<!-- Main Logo -->
<header class="text-center py-6">
    <h1 class="text-4xl font-black tracking-tighter text-skin-accent drop-shadow-sm">
        <a href="/" class="hover:underline decoration-2 underline-offset-4">Ebala.ch</a>
    </h1>
</header>

<!-- Content -->
<main class="container mx-auto px-2 md:px-4 flex-grow max-w-7xl">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="mt-12 py-6 text-center text-xs text-skin-muted border-t border-skin-border/30">
    <p class="mb-2">Увесь контент створено користувачами.</p>
    <div class="flex justify-center gap-4">
        <a href="#" class="hover:text-skin-text">Про нас</a>
        <a href="#" class="hover:text-skin-text">Правила</a>
        <a href="#" class="hover:text-skin-text">API</a>
    </div>
</footer>

<!-- Theme Switch JS -->
<script>
    const themeToggle = document.getElementById('theme-toggle');
    const iconLight = document.getElementById('icon-light');
    const iconDark = document.getElementById('icon-dark');
    const html = document.documentElement;

    function updateIcons(theme) {
        if (theme === 'dark') {
            iconLight.classList.remove('hidden');
            iconDark.classList.add('hidden');
        } else {
            iconLight.classList.add('hidden');
            iconDark.classList.remove('hidden');
        }
    }

    // Init
    updateIcons(html.getAttribute('data-theme'));

    themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcons(newTheme);
    });
</script>
</body>
</html>
