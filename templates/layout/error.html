{% extends "layout/base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-skin-surface border border-red-500/30 p-8 rounded-lg shadow-xl max-w-md text-center">
        <h1 class="text-4xl font-bold text-skin-red mb-2">Error</h1>
        <div class="h-1 w-16 bg-skin-red mx-auto mb-6"></div>
        <p class="text-lg text-skin-text mb-6 font-mono bg-skin-base p-2 rounded">
            {{ message }}
        </p>
        <a href="javascript:history.back()" class="inline-block bg-skin-header text-white px-6 py-2 rounded hover:bg-skin-accent transition-colors">
            Go Back
        </a>
    </div>
</div>
{% endblock %}
