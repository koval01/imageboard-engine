<div class="flex justify-center mb-10">
  <div class="bg-skin-reply-bg border border-skin-border-reply p-2 rounded-lg shadow-md max-w-lg w-full">
    <details id="post-form-details" open>
      <summary class="text-center text-sm font-bold cursor-pointer select-none text-skin-link hover:text-skin-accent transition-colors">Start a New Thread</summary>

      <form hx-post="/{{ board.slug }}/submit"
            hx-encoding="multipart/form-data"
            hx-target="body"
            hx-indicator="#submit-spinner"
            class="flex flex-col gap-2 p-2 mt-2">

        <div class="flex gap-2 items-center">
          <span class="bg-skin-header text-skin-text text-xs font-bold px-2 py-1 rounded w-16 text-center border border-skin-border-reply">Subject</span>
          <input type="text" name="subject" class="w-full p-1 border border-skin-border-input rounded bg-skin-input text-skin-text focus:outline-none focus:ring-1 focus:ring-skin-link">
        </div>

        <div class="flex gap-2">
          <span class="bg-skin-header text-skin-text text-xs font-bold px-2 py-1 rounded w-16 text-center h-fit border border-skin-border-reply">Comment</span>
          <textarea name="content" rows="4" class="w-full p-1 border border-skin-border-input rounded bg-skin-input text-skin-text focus:outline-none focus:ring-1 focus:ring-skin-link" required></textarea>
        </div>

        <div class="flex gap-2 items-center mt-1">
          <span class="bg-skin-header text-skin-text text-xs font-bold px-2 py-1 rounded w-16 text-center border border-skin-border-reply">File</span>
          <div class="flex flex-col flex-1">
            <div class="flex gap-2 items-center justify-between">
              <div>
                <input type="file" name="file" multiple id="file-input" class="hidden">
                <button type="button" onclick="document.getElementById('file-input').click()" class="bg-skin-surface border border-skin-border-input px-3 py-1 text-xs hover:bg-gray-200 cursor-pointer rounded shadow-sm text-skin-text">
                  Browse...
                </button>
              </div>
              <button type="submit" class="bg-skin-header border border-skin-border-reply px-6 py-1 text-sm font-bold hover:bg-skin-surface cursor-pointer rounded shadow-sm text-skin-text min-w-[80px] flex justify-center">
                <span class="btn-text">Post</span>
                <span id="submit-spinner" class="loading-spinner hidden">
                                    <svg class="animate-spin h-4 w-4 text-skin-text" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </span>
              </button>
            </div>
            <div class="file-list-display text-[10px] text-skin-link mt-1 hidden font-mono"></div>
          </div>
        </div>
      </form>
    </details>
  </div>
</div>
